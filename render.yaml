services:
  - type: web
    name: situado-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_TITLE
        value: Situado de Puerto Jack e IP
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: situado-db
          property: connectionString

  - type: web
    name: situado-web
    env: static
    staticPublishPath: .
    buildCommand: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: situado-db
    databaseName: situado_db
    user: postgres
